name: Build Pawgram Android (APK)

on:
  push:
    branches: [ "main", "dev", "ci" ]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;37.0.0 ndk;27.3.13750724 platforms;android-37.0 cmake;3.22.1"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties
          echo 'android.native.buildOutput=verbose' >> ~/.gradle/gradle.properties

      - name: Configure Signing
        run: |
          if [ -n "${{ secrets.KEYSTORE_JKS }}" ]; then
            echo "${{ secrets.KEYSTORE_JKS }}" | base64 --decode > keystore.jks
            echo "storeFile=${{ github.workspace }}/keystore.jks" >> local.properties
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> local.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> local.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> local.properties
          else
            keytool -genkey -v -keystore keystore.jks -alias pawgram -keyalg RSA -keysize 2048 -validity 10000 -storepass pawgram123 -keypass pawgram123 -dname "CN=Pawgram, OU=Mobile, O=Pawgram, L=City, S=State, C=US"
            echo "storeFile=${{ github.workspace }}/keystore.jks" >> local.properties
            echo "storePassword=pawgram123" >> local.properties
            echo "keyAlias=pawgram" >> local.properties
            echo "keyPassword=pawgram123" >> local.properties
          fi

      - name: Configure Secrets
        run: |
          touch sentry.properties
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > TMessagesProj_App/google-services.json
          fi
          echo "mapsApiKey=" >> local.properties

      - name: Build with Gradle
        run: |
          ./gradlew assembleRelease --no-daemon

      - name: Upload arm64-v8a build apk
        uses: actions/upload-artifact@v4
        with:
          name: Pawgram-Android-arm64-v8a
          path: TMessagesProj_App/build/outputs/apk/release/*-arm64-v8a.apk
          if-no-files-found: warn

      - name: Upload universal build apk
        uses: actions/upload-artifact@v4
        with:
          name: Pawgram-Android-Universal
          path: TMessagesProj_App/build/outputs/apk/release/*-universal.apk
          if-no-files-found: warn

      - name: Upload all outputs
        uses: actions/upload-artifact@v4
        with:
          name: Pawgram-All-Apks
          path: TMessagesProj_App/build/outputs/apk/release/*.apk
          if-no-files-found: warn
